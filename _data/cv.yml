- title: Правообладатель, условия предоставления прав и стоимость программного обеспечения
  type: nested_list
  contents:
    - title: Правообладатель
      items:
        - ООО "СИСТЕМНЫЕ РЕШЕНИЯ" является правообладателем отечественной облачной платформы moncloud
    - title: Условия предоставления прав
      items:
        - Заключение лицензионного договора, сублицензионного договора, или иных гражданско-правовых договоров.
    - title: Стоимость программного обеспечения
      items:
        - Стоимость ПО устанавливается индивидуально с учётом объемов, сроков передачи прав, и прочих условий, определяемых в рамках договорных отношений. Для расчёта стоимости и приобретения прав на ПО Вы можете обратиться в ООО «СИСТЕМНЫЕ РЕШЕНИЯ» по электронной почте <a href="mailto:info@moncloud.ru">info@moncloud.ru</a> или по телефону, указанному в разделе «контакты» интернет-сайта по адресу <a href="https://moncloud.ru/contacts/"> https://moncloud.ru</a>

