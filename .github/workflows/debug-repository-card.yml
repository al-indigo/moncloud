name: Debug repository card

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/debug-repository-card.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Russian card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=torvalds&repo=linux&theme=default&locale=ru&show_owner=true&description_lines_count=5
          path: cards/ru.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate English card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=torvalds&repo=linux&theme=default&locale=en&show_owner=true&description_lines_count=5
          path: cards/en.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print generated SVG files
        if: always()
        shell: bash
        run: |
          set -u
          for card in cards/*.svg; do
            echo "::group::$card"
            cat "$card"
            echo '::endgroup::'
          done

      - name: Upload generated SVG files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-repository-card
          path: cards/*.svg
          if-no-files-found: error
          retention-days: 1
